services:
  mongo:
    image: mongo:7
    container_name: roleshift-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: roleshift-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: roleshift
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      APP_ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: roleshift-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data: